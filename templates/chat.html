<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat & File Upload</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* Inline styles for better layout */
    body { font-family: Arial, sans-serif; background-color: #f1f1f1; }
    .chat-container { max-width: 600px; margin: 40px auto; background: #fff; padding: 20px; border-radius: 8px; }
    .section { margin-bottom: 20px; }
    input[type="text"], input[type="file"] { width: 100%; padding: 10px; margin-bottom: 10px; }
    button { padding: 10px 20px; background: #007BFF; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .response-area { background: #f9f9f9; border: 1px solid #ccc; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="chat-container">
    <h2>Chat & File Upload</h2>
    
    <!-- File Upload Section -->
    <div class="section" id="uploadSection">
      <h3>File Upload</h3>
      <input type="file" id="fileInput">
      <button onclick="uploadFile()">Upload File</button>
      <div id="uploadStatus" class="response-area"></div>
    </div>
    
    <!-- Chat Section -->
    <div class="section" id="chatSection">
      <h3>Chat</h3>
      <input type="text" id="chatQuery" placeholder="Ask: what is my file name?">
      <button onclick="sendChatQuery()">Send</button>
      <div id="chatResponse" class="response-area"></div>
    </div>
  </div>

  <script>
    // Since the token is stored in an HTTP-only cookie, it is automatically sent with requests.
    async function uploadFile() {
      const fileInput = document.getElementById("fileInput");
      if (fileInput.files.length === 0) {
        alert("Please select a file to upload.");
        return;
      }
      // Step 1: Get ephemeral upload link
      const linkResponse = await fetch("/generate_upload_link", {
        method: "POST",
        headers: { "Content-Type": "application/json" }
      });
      const linkResult = await linkResponse.json();
      if (!linkResponse.ok) {
        document.getElementById("uploadStatus").innerText = linkResult.message;
        return;
      }
      const uploadId = linkResult.upload_id;
      // Step 2: Upload file using the obtained upload ID
      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("upload_id", uploadId);
      const uploadResponse = await fetch("/upload", {
        method: "POST",
        body: formData
      });
      const uploadResult = await uploadResponse.json();
      document.getElementById("uploadStatus").innerText = uploadResult.message;
    }

    async function sendChatQuery() {
      const query = document.getElementById("chatQuery").value;
      if (!query) {
        alert("Please type your query.");
        return;
      }
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: query })
      });
      const result = await response.json();
      document.getElementById("chatResponse").innerText = result.response;
    }
  </script>
</body>
</html>
